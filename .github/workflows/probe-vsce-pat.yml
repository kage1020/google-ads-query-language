name: Probe VSCE_PAT

# One-off diagnostic. Answers two questions without ever printing the token:
#   1. Is the stored VSCE_PAT still valid?
#   2. Which identity owns it, and what roles does that identity hold on the
#      publisher "kage1020"?
#
# Delete this file once the answers are in hand.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          PAT: ${{ secrets.VSCE_PAT }}
          PUBLISHER: kage1020
          PUBLISHER_GUID: b9938809-639c-4654-a926-e7716d8a3488
        run: |
          if [ -z "$PAT" ]; then
            echo "VSCE_PAT is not set. Nothing to probe."
            exit 1
          fi

          AUTH="$(printf ':%s' "$PAT" | base64 -w0)"

          call() {
            # $1 = label, $2 = url
            echo "=============================================="
            echo "$1"
            echo "  $2"
            code=$(curl -sS -o /tmp/body -w '%{http_code}' \
              -H "Authorization: Basic $AUTH" \
              -H 'Accept: application/json' \
              "$2" || echo 000)
            echo "  HTTP $code"
            # Only echo the body for successful JSON responses; an auth failure
            # page is noise and a 203 is Azure DevOps' sign-in HTML.
            if [ "$code" = "200" ]; then
              head -c 4000 /tmp/body | python3 -m json.tool 2>/dev/null \
                || head -c 4000 /tmp/body
              echo
            fi
          }

          # 1. Whose token is this? A 200 here proves the PAT is still alive and
          #    names the identity that actually owns the publisher.
          call "PAT owner identity" \
            "https://app.vssps.visualstudio.com/_apis/profile/profiles/me?api-version=6.0"

          # 2. Who holds roles on the publisher? Endpoint shape is unverified —
          #    a 404 means "wrong URL", a 401/403 means "right URL, no access".
          call "Publisher role assignments" \
            "https://marketplace.visualstudio.com/_apis/securityroles/scopes/gallery.publisher/roleassignments/resources/${PUBLISHER_GUID}?api-version=7.1-preview.1"

          call "Publisher role assignments (by name)" \
            "https://marketplace.visualstudio.com/_apis/securityroles/scopes/gallery.publisher/roleassignments/resources/${PUBLISHER}?api-version=7.1-preview.1"

          echo "=============================================="
          echo "Done. The token itself was never printed."
